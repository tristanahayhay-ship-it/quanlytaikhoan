<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRPAY-代理钱包</title>
    <!-- Thư viện icon chuyên dụng -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Khối nút chức năng Thêm mới phía trên cùng bên trái -->
    <div class="top-actions">
        <button class="btn" onclick="openModal('addSingleModal')"><i class="fa-solid fa-plus"></i> 新增账户</button>
        <button class="btn" onclick="openModal('addBatchModal')"><i class="fa-solid fa-list-check"></i> 批量新增账户</button>
        
        <!-- Khối chứa các nút hành động hàng loạt (Chỉ hiện khi có tích chọn Checkbox) -->
        <div class="batch-ops" id="batchOpsArea">
            <span class="selected-count" id="selectedCountText">已选取 0 个项目</span>
            <button class="btn btn-green" onclick="openModal('batchNoteModal')"><i class="fa-solid fa-pen"></i> 批量备注</button>
            <button class="btn btn-red" onclick="executeBatchDelete()"><i class="fa-solid fa-trash"></i> 批量删除</button>
        </div>
    </div>

    <div class="container">
        <!-- Thanh tiêu đề chính -->
        <div class="header">
            <div class="title">HRPAY-代理钱包</div>
            <div class="header-tools">
                <i class="fa-solid fa-list-check" id="btnBatchSearch" title="批量搜索账号" onclick="toggleSearchPanel('batch')"></i>
                <i class="fa-solid fa-magnifying-glass" id="btnSingleSearch" title="搜索" onclick="toggleSearchPanel('single')"></i>
                <i class="fa-solid fa-arrow-down-wide-short" id="btnGroupSearch" title="按组搜索" onclick="toggleSearchPanel('group')"></i>
                <i class="fa-solid fa-filter" id="btnColumns" title="筛选列" onclick="toggleColumnsDropdown()"></i>
                
                <!-- Menu thả xuống chọn Ẩn/Hiện cột -->
                <div class="dropdown-menu" id="columnsDropdown">
                    <label><input type="checkbox" checked data-col="1" onchange="syncColumns()"> 卡商</label>
                    <label><input type="checkbox" checked data-col="2" onchange="syncColumns()"> 卡号</label>
                    <label><input type="checkbox" checked data-col="3" onchange="syncColumns()"> HRPAY-BK (代理钱包)</label>
                    <label><input type="checkbox" checked data-col="4" onchange="syncColumns()"> 跑量</label>
                    <label><input type="checkbox" checked data-col="5" onchange="syncColumns()"> 密码</label>
                    <label><input type="checkbox" checked data-col="6" onchange="syncColumns()"> 备注</label>
                    <label><input type="checkbox" checked data-col="7" onchange="syncColumns()"> 状态</label>
                </div>
            </div>
        </div>

        <!-- Khối Tag chứa bộ lọc đang hoạt động -->
        <div class="tags-area" id="tagsArea"></div>

        <!-- Khối mở rộng: Nhập tìm kiếm hàng loạt Số tài khoản (Nút 1) -->
        <div class="panel-extended" id="panelBatchSearch">
            <label>输入 nhiều tài khoản (Mỗi hàng 1 số):</label>
            <textarea id="batchSearchInput" placeholder="01641016686&#10;01791900141"></textarea>
            <div class="panel-actions">
                <button class="btn btn-gray" onclick="closeAllPanels()">取消</button>
                <button class="btn" onclick="submitBatchSearch()">搜索</button>
            </div>
        </div>

        <!-- Khối mở rộng: Nhập tìm kiếm đơn lẻ Số tài khoản (Nút 2) -->
        <div class="panel-extended" id="panelSingleSearch">
            <label>输入 một tài khoản để tra cứu:</label>
            <input type="text" id="singleSearchInput" placeholder="输入卡号...">
            <div class="panel-actions">
                <button class="btn btn-gray" onclick="closeAllPanels()">取消</button>
                <button class="btn" onclick="submitSingleSearch()">搜索</button>
            </div>
        </div>

        <!-- Khối mở rộng: Tìm kiếm theo Tên nhóm dựa vào Ghi chú (Nút 3) -->
        <div class="panel-extended" id="panelGroupSearch">
            <label>输入 tên nhóm để tìm toàn bộ thẻ (Ví dụ: GR084):</label>
            <input type="text" id="groupSearchInput" placeholder="输入组名...">
            <div class="panel-actions">
                <button class="btn btn-gray" onclick="closeAllPanels()">取消</button>
                <button class="btn" onclick="submitGroupSearch()">搜索</button>
            </div>
        </div>

        <!-- Thanh tìm kiếm nhanh mặc định -->
        <div class="search-area">
            <div class="search-box">
                <div class="search-icon-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <input type="text" id="quickSearchInput" placeholder="快速查找..." oninput="applyFilters()">
            </div>
        </div>

        <!-- Bảng danh sách dữ liệu chính -->
        <table class="data-table" id="mainTable">
            <thead>
                <tr>
                    <th style="width: 5%;"><input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()"></th>
                    <th style="width: 10%;">卡商</th>
                    <th style="width: 20%;">卡号</th>
                    <th style="width: 25%;">HRPAY-BK (代理钱包)</th>
                    <th style="width: 10%;">跑量</th>
                    <th style="width: 10%;">密码</th>
                    <th style="width: 10%;">备注</th>
                    <th style="width: 10%;">状态</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- ================= CỬA SỔ POPUP (MODAL) ================= -->
    
    <!-- Popup 1: Thêm/Sửa tài khoản đơn lẻ -->
    <div class="modal-overlay" id="addSingleModal">
        <div class="modal-content">
            <h3 id="modalTitle">新增账户</h3>
            <input type="hidden" id="editRowIndex">
            <div class="form-group"><label>卡商:</label><input type="text" id="formKashang"></div>
            <div class="form-group"><label>卡号:</label><input type="text" id="formKahao"></div>
            <div class="form-group"><label>跑量:</label><input type="text" id="formPaoliang"></div>
            <div class="form-group"><label>密码:</label><input type="text" id="formMima"></div>
            <div class="form-group"><label>备注:</label><input type="text" id="formBeizhu"></div>
            <div class="form-group"><label>状态:</label><input type="text" id="formZhuangtai"></div>
            <div class="panel-actions">
                <button class="btn btn-gray" onclick="closeModal('addSingleModal')">关闭</button>
                <button class="btn" onclick="saveSingleAccount()">保存</button>
            </div>
        </div>
    </div>

    <!-- Popup 2: Thêm tài khoản hàng loạt -->
    <div class="modal-overlay" id="addBatchModal">
        <div class="modal-content">
            <h3>批量新增账户</h3>
            <div class="form-group"><label>卡商:</label><input type="text" id="batchKashang" value="H001"></div>
            <div class="form-group"><label>卡号:</label><input type="text" id="batchKahao" value=""></div>
            <div class="form-group"><label>跑量:</label><input type="text" id="batchPaoliang" value="5w"></div>
            <div class="form-group"><label>密码:</label><input type="text" id="batchMima" value=""></div>
            <div class="panel-actions">
                <button class="btn btn-gray" onclick="closeModal('addBatchModal')">关闭</button>
                <button class="btn" onclick="saveBatchAccounts()">保存</button>
            </div>
        </div>
    </div>

    <!-- Popup 3: Sửa ghi chú hàng loạt -->
    <div class="modal-overlay" id="batchNoteModal">
        <div class="modal-content">
            <h3>批量备注</h3>
            <div class="form-group">
                <label>输入 nội dung ghi chú mới cho các mục đã chọn:</label>
                <input type="text" id="batchNoteInput" placeholder="例如: GR084">
            </div>
            <div class="panel-actions">
                <button class="btn btn-gray" onclick="closeModal('batchNoteModal')">关闭</button>
                <button class="btn btn-green" onclick="executeBatchNote()">更新</button>
            </div>
        </div>
    </div>

    <!-- Nhúng mã xử lý tách file -->
    <script src="db.js"></script>
    <script src="ui.js"></script>
    <script src="actions.js"></script>
</body>
</html>
