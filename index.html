<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代理钱包管理系统</title>
    <!-- Thư viện giao diện bên ngoài -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link href="https://unpkg.com" rel="stylesheet">
    <!-- File CSS riêng của bạn -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container-fluid">
    <div class="system-box">
        <h2 class="text-primary mb-4">📊 代理钱包管理系统</h2>

        <!-- TABS CHUYỂN MỤC NHỎ -->
        <ul class="nav nav-tabs mb-3" id="walletTabs">
            <li class="nav-item"><a class="nav-link active" href="#" onclick="switchWallet('HRPAY-BK')">HRPAY-BK</a></li>
            <li class="nav-item"><a class="nav-link" href="#" onclick="switchWallet('HRPAY-NA')">HRPAY-NA</a></li>
            <li class="nav-item"><a class="nav-link" href="#" onclick="switchWallet('BDPAY-BK')">BDPAY-BK</a></li>
            <li class="nav-item"><a class="nav-link" href="#" onclick="switchWallet('BDPAY-NA')">BDPAY-NA</a></li>
        </ul>

        <!-- THANH CÔNG CỤ -->
        <div class="row g-3 mb-3 align-items-center">
            <div class="col-md-3">
                <input type="text" id="global-search" class="form-control" placeholder="🔍 批量搜索 (Tìm kiếm hàng loạt)...">
            </div>
            <div class="col-md-2">
                <button class="btn btn-warning w-100" onclick="toggleGroupByKam商()">🔄 按卡商分组</button>
            </div>
            <div class="col-md-2">
                <button class="btn btn-danger w-100" onclick="prepareDeleteRows()">🗑️ 批量删除</button>
            </div>
            <div class="col-md-3">
                <button class="btn btn-success w-100" data-bs-toggle="modal" data-bs-target="#addModal">➕ 批量添加数据</button>
            </div>
            <div class="col-md-2 text-end">
                <span id="total-records" class="badge bg-secondary p-2">加载中...</span>
            </div>
        </div>

        <!-- BẢNG HIỂN THỊ DỮ LIỆU -->
        <div id="main-table"></div>
    </div>
</div>

<!-- CỬA SỔ 1: THÊM DỮ LIỆU HÀNG LOẠT -->
<div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">📥 批量数据录入</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted">格式: <b>卡商,卡号,微信号/钱包,跑量,密码,备注,状态</b> (每行一条)</p>
                <textarea id="bulk-input-area" class="form-control" rows="8" placeholder="卡商A,6222021234567,HRPAY1,50000,pwd123,正常,激活"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="submitBulkData()">🚀 提交到系统</button>
            </div>
        </div>
    </div>
</div>

<!-- CỬA SỔ 2: XÁC NHẬN XÓA & COPY -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">⚠️ 确认删除数据</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="text-danger fw-bold">请检查并复制以下即将被删除的数据列表：</p>
                <textarea id="delete-list-area" class="form-control mb-3" rows="8" readonly></textarea>
                <div class="d-flex justify-content-between">
                    <button class="btn btn-sm btn-secondary" onclick="copyDeleteList()">📋 复制到剪贴板</button>
                    <span id="copy-status" class="text-success fw-bold"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="btn-confirm-delete-action" onclick="executeDeleteRows()">🔥 确认删除</button>
            </div>
        </div>
    </div>
</div>

<!-- Gọi thư viện và file xử lý logic Javascript -->
<script src="https://unpkg.com"></script>
<script src="https://jsdelivr.net"></script>
<script src="app.js"></script>
</body>
</html>
